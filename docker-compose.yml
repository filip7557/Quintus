version: '3.9'

services:
    db:
        image: postgres:16
        container_name: quintus-db
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: quintus
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: quintus-api
        restart: always
        depends_on:
            - db
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings_QuintusDb: Host=db;Database=quintus;Username=postgres;Password=secret
        env_file:
            - ./Backend/Quintus/Quintus.WebAPI/.env
        expose:
            - "8080"

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: quintus-ui
        restart: always
        depends_on:
            - backend
        expose:
            - "3000"

    nginx:
        image: nginx:latest
        container_name: quintus-proxy
        restart: always
        depends_on:
            - frontend
            - backend
        ports:
            - "80:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
    postgres_data:
